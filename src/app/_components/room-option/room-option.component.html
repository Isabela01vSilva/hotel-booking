<div class="room-card d-flex justify-content-between align-items-end">
  <div class="room-info">
    <h2 class="room-title">{{ room.roomType.name }}</h2>

    @if (room.cancellationPolicies.refundable) {
    <p class="room-cancellation">
      <i class="ph ph-check-circle"></i>
      Cancelamento gratuito
    </p>
    } @else {
    <p class="room-cancellation">
      <i class="ph ph-x-circle"></i>
      Multa de cancelamento
    </p>
    }
  </div>

  <div class="room-booking d-flex justify-content-between g-4">
    <div class="room-price-info">
      <p class="room-price">
        <strong>{{
          room.price.amount | currency : room.price.currency : "symbol"
        }}</strong>
        / noite
      </p>
      <p class="room-payment">Pagamento no hotel</p>
    </div>
    <div class="room-btn">
      <app-button
        textoBotao="Reservar Agora"
        (click)="pesquisar()"
      ></app-button>
    </div>
  </div>
</div>
