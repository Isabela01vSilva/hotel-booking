<form class="search-box">
  <div class="search-item">
    <div class="label-row">
      <i class="ph ph-map-pin"></i>
      <label for="destino">Destino</label>
    </div>
    <input
      type="text"
      id="destino"
    />
  </div>

  <div class="search-item border-left-custom">
    <div class="label-row">
      <i class="ph ph-calendar-blank"></i>
      <label for="entrada">Entrada</label>
    </div>
    <input
      type="text"
      id="entrada"
    />
  </div>

  <div class="search-item border-left-custom">
    <div class="label-row">
      <i class="ph ph-calendar-blank"></i>
      <label for="saida">Saída</label>
    </div>
    <input
      type="text"
      id="saida"
    />
  </div>

  <div class="search-item border-left-custom">
    <div class="label-row">
      <i class="ph ph-users"></i>
      <label for="hospedes">Hóspedes</label>
    </div>
    <input type="text" id="hospedes" />
  </div>

  <div class="search-item">
    <app-button textoBotao="Pesquisar" (click)="pesquisar()" class="btn-search"></app-button>
  </div>
</form>
