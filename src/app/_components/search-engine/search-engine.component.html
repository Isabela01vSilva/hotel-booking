<form [formGroup]="form" class="search-box" (onsubmit)="pesquisar()">
  <!-- Destino -->
  @if (su | async; as sug) {
  <app-destination-input
    labelText="Destino"
    [isError]="(form.get('destino')?.invalid && formSubmetido) == true"
    [suggestionsList]="sug"
    formControlName="destino"
  ></app-destination-input>
  }

  <!-- ENTRADA -->
  <app-date-input
    labelText="Entrada"
    [isError]="(form.get('entrada')?.invalid && formSubmetido) == true"
    formControlName="entrada"
  >
  </app-date-input>

  <!-- SAÍDA -->
  <app-date-input
    labelText="Saída"
    [isError]="(form.get('saida')?.invalid && formSubmetido) == true"
    formControlName="saida"
  ></app-date-input>

  <!-- HÓSPEDES -->
  <app-guest-input formControlName="hospedes"></app-guest-input>

  <!-- BOTÃO DE PESQUISA -->
  <div class="search-item">
    <app-button
      textoBotao="Pesquisar"
      class="btn-search"
      type="submit"
      routerLink="search"
      [queryParams]="{
        sugestionName: myControl.value?.name,
        sugestionRegion: myControl.value?.region
      }"
    ></app-button>
  </div>
</form>

<!-- Roteador Angular -->
<div>
  <router-outlet (activate)="onActivate($event)"></router-outlet>
</div>
