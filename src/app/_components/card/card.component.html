<div class="card">
  <div class="card-image-wrapper">
    <img
      src="https://khotel.com.br/wp-content/uploads/2025/05/Suite-Master-3-960x560.jpg"
      class="card-image"
      alt="Hotel"
    />
    <span class="card-price"><b>R$ 70</b>/ noite</span>
  </div>
  <div class="card-content d-flex justify-content-between">
    <div class="card-header">
      <b class="hotel-name">Stadshotel Steegoversloot</b>
      <i class="ph ph-star star-icon"></i>
    </div>
    <div class="card-actions">
      <app-button textoBotao="Ver mais"  (click)="pesquisar()"></app-button>
    </div>
  </div>
</div>
